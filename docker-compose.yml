version: '3.8'

services:
  va-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: va-assistant
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
      - ALLOWED_HOSTS=*
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./db.sqlite3:/app/db.sqlite3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - va-network

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: va-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - va-assistant
    restart: unless-stopped
    networks:
      - va-network
    profiles:
      - production

networks:
  va-network:
    driver: bridge

volumes:
  va-data:
    driver: local 